<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="查看短剧助手的追更动态、系统操作、账号同步和检查记录。"
    >
    <meta name="theme-color" content="#f3f5f7">
    <meta name="application-name" content="短剧助手">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="短剧助手">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>运行记录 · 短剧助手</title>
    <script src="/theme.js"></script>
    <script src="/pwa.js" defer></script>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link
      rel="icon"
      href="/assets/panda-drama-assistant-icon.svg"
      type="image/svg+xml"
    >
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="logs-page">
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <header class="app-header">
      <div class="app-header__inner">
        <a class="brand" href="/" aria-label="返回短剧助手首页">
          <span class="brand__mark" aria-hidden="true">
            <img
              class="brand__logo"
              src="/assets/panda-drama-assistant-icon.svg"
              alt=""
              width="38"
              height="38"
            >
          </span>
          <span class="brand__text">短剧助手</span>
        </a>
        <div class="app-header__actions">
          <a
            class="button button--quiet logs-back-link"
            href="/"
            aria-label="返回追更"
            title="返回追更"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <use href="#icon-arrow-left"></use>
            </svg>
            <span class="header-action__label">返回追更</span>
          </a>
          <button
            class="button button--quiet pwa-install-button"
            type="button"
            data-pwa-install
            aria-label="安装短剧助手应用"
            title="安装应用"
            hidden
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <use href="#icon-download"></use>
            </svg>
            <span class="header-action__label">安装应用</span>
          </button>
          <button
            class="theme-switcher"
            type="button"
            data-theme-toggle
            data-theme-preference="auto"
            aria-label="当前主题：自动，跟随系统。点击切换为白天主题"
            title="当前：自动（跟随系统），点击切换为白天"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <use data-theme-icon href="#icon-auto"></use>
            </svg>
            <span class="theme-switcher__label" data-theme-label aria-live="polite">
              自动
            </span>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content" class="page logs-page__main">
      <section class="logs-overview" aria-labelledby="logs-title">
        <div class="logs-overview__copy">
          <p class="eyebrow">追更动态与系统操作</p>
          <h1 id="logs-title">运行记录</h1>
          <p class="logs-overview__description">
            查看集数、新季和完结变化，以及登录、同步、设置等操作。
          </p>
        </div>
        <dl class="logs-stats" aria-label="日志概况">
          <div class="logs-stat">
            <dt>总记录</dt>
            <dd id="logs-total">-</dd>
          </div>
          <div class="logs-stat">
            <dt>日志文件</dt>
            <dd id="logs-file-count">-</dd>
          </div>
          <div class="logs-stat logs-stat--wide">
            <dt>最新记录</dt>
            <dd id="logs-newest">读取中</dd>
          </div>
        </dl>
      </section>

      <section class="logs-surface" aria-labelledby="logs-list-title">
        <div
          class="logs-view-tabs"
          role="tablist"
          aria-label="日志类型"
        >
          <button
            class="logs-view-tab"
            id="logs-tab-events"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="logs-list"
            tabindex="0"
            data-log-view="events"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <use href="#icon-bell"></use>
            </svg>
            <span>追更动态</span>
          </button>
          <button
            class="logs-view-tab"
            id="logs-tab-system"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="logs-list"
            tabindex="-1"
            data-log-view="system"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <use href="#icon-settings"></use>
            </svg>
            <span>系统操作</span>
          </button>
        </div>

        <div class="logs-toolbar">
          <div class="logs-toolbar__copy">
            <h2 id="logs-list-title">追更动态</h2>
            <p id="logs-storage">
              按天归档，单个文件达到 1 MiB 后自动分卷。
            </p>
          </div>
          <div class="logs-toolbar__actions">
            <a
              class="button button--quiet logs-open-file"
              href="/api/logs/file"
              target="_blank"
              rel="noopener"
              id="logs-open-file"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="#icon-download"></use>
              </svg>
              <span>打开文件</span>
            </a>
            <button
              class="button button--secondary logs-refresh"
              type="button"
              id="logs-refresh"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <use href="#icon-refresh"></use>
              </svg>
              <span>刷新</span>
            </button>
          </div>
        </div>

        <p class="logs-status" id="logs-status" role="status" aria-live="polite">
          正在读取日志…
        </p>
        <div
          class="logs-list"
          id="logs-list"
          role="tabpanel"
          aria-labelledby="logs-tab-events"
          aria-live="polite"
          aria-busy="true"
        ></div>

        <div class="logs-footer">
          <p class="logs-range" id="logs-range"></p>
          <button
            class="button button--secondary"
            type="button"
            id="logs-load-more"
            hidden
          >
            <span>加载更多</span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <use href="#icon-chevron-down"></use>
            </svg>
          </button>
        </div>
      </section>
    </main>

    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="icon-play" viewBox="0 0 24 24">
        <path d="m8 5 11 7-11 7Z"></path>
      </symbol>
      <symbol id="icon-arrow-left" viewBox="0 0 24 24">
        <path d="m15 18-6-6 6-6"></path>
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M12 3v12"></path>
        <path d="m7 10 5 5 5-5"></path>
        <path d="M5 21h14"></path>
      </symbol>
      <symbol id="icon-auto" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 3a9 9 0 0 1 0 18Z"></path>
      </symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24">
        <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"></path>
      </symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24">
        <path d="M20 11a8 8 0 1 0-2.34 5.66"></path>
        <path d="M20 4v7h-7"></path>
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6"></path>
      </symbol>
      <symbol id="icon-bell" viewBox="0 0 24 24">
        <path d="M10.27 21a2 2 0 0 0 3.46 0"></path>
        <path d="M3.26 15.33A1 1 0 0 1 4 13.67h.01a2 2 0 0 0 2-2V8a6 6 0 0 1 12 0v3.67a2 2 0 0 0 2 2H20a1 1 0 0 1 .74 1.66 10 10 0 0 1-17.48 0Z"></path>
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="m20 6-11 11-5-5"></path>
      </symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 8v5M12 16h.01"></path>
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 7v5l3 2"></path>
      </symbol>
      <symbol id="icon-inbox" viewBox="0 0 24 24">
        <path d="M4 4h16v16H4z"></path>
        <path d="M4 13h4l2 3h4l2-3h4"></path>
      </symbol>
    </svg>

    <noscript>
      <p class="logs-noscript">需要启用 JavaScript 才能读取日志。</p>
    </noscript>
    <script src="/logs.js" defer></script>
  </body>
</html>
