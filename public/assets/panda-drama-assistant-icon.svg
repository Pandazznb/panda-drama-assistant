<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">短剧助手图标</title>
  <desc id="desc">深色圆角背景上的熊猫头像、播放按钮和提醒标记。</desc>
  <defs>
    <linearGradient id="background" x1="112" y1="72" x2="912" y2="952">
      <stop offset="0" stop-color="#222a31" />
      <stop offset="0.55" stop-color="#14191f" />
      <stop offset="1" stop-color="#090c10" />
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="43%" r="58%">
      <stop offset="0" stop-color="#e95154" stop-opacity="0.22" />
      <stop offset="0.62" stop-color="#c73740" stop-opacity="0.06" />
      <stop offset="1" stop-color="#c73740" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fur" x1="322" y1="278" x2="700" y2="774">
      <stop offset="0" stop-color="#fffdf7" />
      <stop offset="0.68" stop-color="#eeeae1" />
      <stop offset="1" stop-color="#d8d3ca" />
    </linearGradient>
    <linearGradient id="ink" x1="288" y1="248" x2="738" y2="692">
      <stop offset="0" stop-color="#303840" />
      <stop offset="1" stop-color="#101419" />
    </linearGradient>
    <linearGradient id="play" x1="650" y1="618" x2="838" y2="812">
      <stop offset="0" stop-color="#ff6a67" />
      <stop offset="0.52" stop-color="#dc3f43" />
      <stop offset="1" stop-color="#9e202d" />
    </linearGradient>
    <linearGradient id="alert" x1="727" y1="166" x2="855" y2="296">
      <stop offset="0" stop-color="#ffd67a" />
      <stop offset="1" stop-color="#e99b2f" />
    </linearGradient>
    <filter id="face-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="32" stdDeviation="26" flood-color="#020406" flood-opacity="0.56" />
    </filter>
    <filter id="badge-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.52" />
    </filter>
    <filter id="alert-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="glow" />
      <feFlood flood-color="#f6b94d" flood-opacity="0.38" />
      <feComposite in2="glow" operator="in" result="coloredGlow" />
      <feMerge>
        <feMergeNode in="coloredGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#background)" />
  <rect x="12" y="12" width="1000" height="1000" rx="210" fill="url(#ambient)" />
  <rect
    x="42"
    y="42"
    width="940"
    height="940"
    rx="188"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.07"
    stroke-width="3"
  />

  <g filter="url(#face-shadow)">
    <circle cx="319" cy="315" r="139" fill="url(#ink)" />
    <circle cx="705" cy="315" r="139" fill="url(#ink)" />
    <path
      d="M512 230c-178 0-292 120-292 284 0 177 122 294 292 294s292-117 292-294c0-164-114-284-292-284Z"
      fill="url(#fur)"
    />
    <path
      d="M322 477c32-34 91-51 135-29 39 20 58 71 33 116-25 45-91 72-142 54-53-19-74-98-26-141Z"
      fill="url(#ink)"
      transform="rotate(18 402 520)"
    />
    <path
      d="M702 477c-32-34-91-51-135-29-39 20-58 71-33 116 25 45 91 72 142 54 53-19 74-98 26-141Z"
      fill="url(#ink)"
      transform="rotate(-18 622 520)"
    />
    <ellipse cx="402" cy="516" rx="25" ry="31" fill="#f7f4ee" />
    <ellipse cx="622" cy="516" rx="25" ry="31" fill="#f7f4ee" />
    <circle cx="402" cy="523" r="12" fill="#151a1f" />
    <circle cx="622" cy="523" r="12" fill="#151a1f" />
    <path
      d="M466 612c0-29 21-51 46-51s46 22 46 51c0 27-20 45-46 45s-46-18-46-45Z"
      fill="#161b20"
    />
    <path
      d="M512 655c-28 0-53 16-68 39 18 27 42 42 68 42s50-15 68-42c-15-23-40-39-68-39Z"
      fill="#ffffff"
      fill-opacity="0.82"
    />
    <path
      d="M512 654v31m0 0c-15 0-29 6-39 17m39-17c15 0 29 6 39 17"
      fill="none"
      stroke="#161b20"
      stroke-linecap="round"
      stroke-width="12"
    />
  </g>

  <g filter="url(#badge-shadow)">
    <circle cx="742" cy="718" r="132" fill="#10151a" />
    <circle
      cx="742"
      cy="718"
      r="112"
      fill="url(#play)"
      stroke="#ffaaa5"
      stroke-opacity="0.3"
      stroke-width="5"
    />
    <path d="M706 650v136c0 17 19 28 34 19l107-68c14-9 14-29 0-38l-107-68c-15-9-34 2-34 19Z" fill="#fffdf9" />
  </g>

  <g filter="url(#alert-glow)">
    <circle cx="793" cy="232" r="82" fill="#13181d" />
    <circle cx="793" cy="232" r="66" fill="url(#alert)" />
    <path
      d="M793 190c-23 0-41 18-41 41v17c0 14-7 27-18 36-7 5-3 16 5 16h108c8 0 12-11 5-16-11-9-18-22-18-36v-17c0-23-18-41-41-41Z"
      fill="#3a2308"
    />
    <path d="M778 304h30c-2 12-7 18-15 18s-13-6-15-18Z" fill="#3a2308" />
  </g>
</svg>
